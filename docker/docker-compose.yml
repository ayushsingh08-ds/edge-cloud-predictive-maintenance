version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smart_factory
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d smart_factory"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart_factory_network
    restart: unless-stopped

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart_factory_network
    restart: unless-stopped

  # Alert Manager Service
  alert_manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: alert_manager
    environment:
      SERVICE_TYPE: alert_manager
      DATABASE_URL: postgresql://user:password@postgres:5432/smart_factory
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
      RABBITMQ_PORT: 5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - smart_factory_network
    restart: unless-stopped

  # Decision Engine Service
  decision_engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: decision_engine
    environment:
      SERVICE_TYPE: decision_engine
      DATABASE_URL: postgresql://user:password@postgres:5432/smart_factory
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
      RABBITMQ_PORT: 5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - smart_factory_network
    restart: unless-stopped

  # Anomaly Detector Service
  anomaly_detector:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: anomaly_detector
    environment:
      SERVICE_TYPE: anomaly_detector
      DATABASE_URL: postgresql://user:password@postgres:5432/smart_factory
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
      RABBITMQ_PORT: 5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - smart_factory_network
    restart: unless-stopped

  # Data Adapter Service
  data_adapter:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: data_adapter
    environment:
      SERVICE_TYPE: data_adapter
      DATABASE_URL: postgresql://user:password@postgres:5432/smart_factory
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
      RABBITMQ_PORT: 5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - smart_factory_network
    restart: unless-stopped

  # RUL Predictor Service
  rul_predictor:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: rul_predictor
    environment:
      SERVICE_TYPE: rul_predictor
      DATABASE_URL: postgresql://user:password@postgres:5432/smart_factory
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
      RABBITMQ_PORT: 5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - smart_factory_network
    restart: unless-stopped

  # Sensor Simulator Service
  sensor_simulator:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: sensor_simulator
    environment:
      SERVICE_TYPE: sensor_simulator
      DATABASE_URL: postgresql://user:password@postgres:5432/smart_factory
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
      RABBITMQ_PORT: 5672
      SENSOR_MODE: normal
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - smart_factory_network
    restart: unless-stopped

  # FastAPI API Gateway
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: api_gateway
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/smart_factory
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
      RABBITMQ_PORT: 5672
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - smart_factory_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/machines"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # WebSocket Server
  websocket:
    build:
      context: .
      dockerfile: docker/Dockerfile.websocket
    container_name: websocket_server
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/smart_factory
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
      RABBITMQ_PORT: 5672
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - smart_factory_network
    restart: unless-stopped

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - smart_factory_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  smart_factory_network:
    driver: bridge
